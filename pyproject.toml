[project]
name = "android-debloater"
version = "0.1.0"
description = "Local Android package inventory and personal app details"
readme = "README.md"
authors = [
    { name = "Rishav Singh", email = "rishav.singh2@arm.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.121,<1",
    "uvicorn>=0.38,<1",
    "jinja2>=3.1.6,<4",
    "pydantic>=2.12,<3",
    "platformdirs>=4.5,<5",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<1", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 110

[project.scripts]
android-debloater = "android_debloater:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
